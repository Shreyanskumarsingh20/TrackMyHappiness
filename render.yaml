# One-click $0 Free Render Blueprint for TrackMyHappiness (Backend + Web App)
# Connect your GitHub repo at https://dashboard.render.com/blueprints
# Uses Render's FREE plan ($0/month, no credit card required).
services:
  - type: web
    name: trackmyhappiness
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DB_PATH
        value: /tmp/trackmyhappiness.db
      - key: TRACKING_PROVIDER
        value: free_direct
      - key: POLL_INTERVAL_MINUTES
        value: "30"
      - key: DEFAULT_DESTINATION_COUNTRY
        value: India
      - key: SEED_DEMO_PARCELS
        value: "false"
      # Optional $0 Free-Tier Keys (enter in Render Dashboard after deploy)
      - key: WHEREPARCEL_API_KEY
        sync: false
      - key: DHL_API_KEY
        sync: false
