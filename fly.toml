# Fly.io Deployment Config for TrackMyHappiness (Backend + Web App + Persistent SQLite Volume)
# Deploy with: fly launch --no-deploy && fly volumes create tmh_data --size 1 && fly deploy
app = "trackmyhappiness"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  DB_PATH = "/data/trackmyhappiness.db"
  TRACKING_PROVIDER = "free_direct"
  POLL_INTERVAL_MINUTES = "30"
  DEFAULT_DESTINATION_COUNTRY = "India"
  SEED_DEMO_PARCELS = "false"

[mounts]
  source = "tmh_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"
